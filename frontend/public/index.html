<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rice Type Classifier — Production ML App</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            emerald: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            },
            teal: {
              500: '#14b8a6',
              600: '#0d9488'
            }
          }
        }
      }
    }
  </script>
  
  <!-- React & Babel CDNs for standalone rendering -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper SVG icons
    const Icons = {
      Sun: () => <svg className="w-5 h-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
      Moon: () => <svg className="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>,
      Upload: () => <svg className="w-10 h-10 text-emerald-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>,
      Leaf: () => <svg className="w-8 h-8 text-emerald-600 dark:text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>,
      Trash: () => <svg className="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      BarChart: () => <svg className="w-5 h-5 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
      CheckCircle: () => <svg className="w-6 h-6 text-emerald-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Refresh: () => <svg className="w-4 h-4 mr-1 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
      X: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
    };

    function App() {
      const [darkMode, setDarkMode] = useState(false);
      const [selectedFile, setSelectedFile] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [loading, setLoading] = useState(false);
      const [prediction, setPrediction] = useState(null);
      const [error, setError] = useState(null);
      const [history, setHistory] = useState([]);
      const [historyLoading, setHistoryLoading] = useState(false);
      const [showMetrics, setShowMetrics] = useState(false);
      const [metricsData, setMetricsData] = useState(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      const fetchHistory = async () => {
        setHistoryLoading(true);
        try {
          const res = await fetch('/history');
          const data = await res.json();
          if (data.success) {
            setHistory(data.history);
          }
        } catch (err) {
          console.error("Failed to load history", err);
        } finally {
          setHistoryLoading(false);
        }
      };

      useEffect(() => {
        fetchHistory();
      }, []);

      const handleFileChange = (file) => {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          setError("Please select a valid image file (JPG, PNG, WEBP).");
          return;
        }
        setError(null);
        setSelectedFile(file);
        setPrediction(null);

        const reader = new FileReader();
        reader.onloadend = () => {
          setImagePreview(reader.result);
        };
        reader.readAsDataURL(file);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleDrop = (e) => {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFileChange(e.dataTransfer.files[0]);
        }
      };

      const handleClassify = async () => {
        if (!selectedFile) return;
        setLoading(true);
        setError(null);

        const formData = new FormData();
        formData.append('image', selectedFile);

        try {
          const response = await fetch('/predict', {
            method: 'POST',
            body: formData,
          });
          const data = await response.json();

          if (response.ok && data.success) {
            setPrediction(data);
            fetchHistory();
          } else {
            setError(data.error || "Failed to classify image.");
          }
        } catch (err) {
          setError("Server connection failed. Make sure Flask app is running.");
        } finally {
          setLoading(false);
        }
      };

      const handleClearHistory = async () => {
        if (!confirm("Are you sure you want to clear all prediction history?")) return;
        try {
          const res = await fetch('/history', { method: 'DELETE' });
          const data = await res.json();
          if (data.success) {
            setHistory([]);
          }
        } catch (err) {
          alert("Failed to clear history.");
        }
      };

      const fetchMetrics = async () => {
        try {
          const res = await fetch('/metrics');
          const data = await res.json();
          if (data.success) {
            setMetricsData(data);
            setShowMetrics(true);
          }
        } catch (err) {
          alert("Failed to load metrics");
        }
      };

      const resetSelection = () => {
        setSelectedFile(null);
        setImagePreview(null);
        setPrediction(null);
        setError(null);
        if (fileInputRef.current) fileInputRef.current.value = "";
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200 dark:border-slate-700 px-6 py-4">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-emerald-100 dark:bg-emerald-950 rounded-xl">
                  <Icons.Leaf />
                </div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-emerald-600 to-teal-600 dark:from-emerald-400 dark:to-teal-400 bg-clip-text text-transparent">
                    Rice Type Classifier
                  </h1>
                  <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">
                    MobileNetV2 CNN Deep Learning Architecture
                  </p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <button 
                  onClick={fetchMetrics}
                  className="px-3.5 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg flex items-center transition-colors"
                >
                  <Icons.BarChart /> Model Evaluation
                </button>

                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors"
                  title="Toggle Light/Dark Theme"
                >
                  {darkMode ? <Icons.Sun /> : <Icons.Moon />}
                </button>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">
            {/* Top Grid: Upload & Result */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              
              {/* Left Column: Image Upload & Preview */}
              <div className="lg:col-span-6 bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-700/80 flex flex-col justify-between">
                <div>
                  <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100 mb-1">Upload Rice Image</h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mb-5">
                    Upload an image of Arborio, Basmati, Ipsala, Jasmine, or Karacadag rice grain.
                  </p>

                  {/* Drop Zone */}
                  <div 
                    onDragOver={handleDragOver}
                    onDrop={handleDrop}
                    onClick={() => fileInputRef.current?.click()}
                    className={`border-2 border-dashed rounded-xl p-6 flex flex-col items-center justify-center cursor-pointer transition-all ${
                      imagePreview 
                        ? 'border-emerald-500 bg-emerald-50/20 dark:bg-emerald-950/20' 
                        : 'border-slate-300 dark:border-slate-600 hover:border-emerald-400 hover:bg-slate-50 dark:hover:bg-slate-750'
                    }`}
                  >
                    <input 
                      type="file" 
                      ref={fileInputRef}
                      onChange={(e) => e.target.files[0] && handleFileChange(e.target.files[0])}
                      accept="image/*" 
                      className="hidden" 
                    />

                    {imagePreview ? (
                      <div className="relative group w-full flex flex-col items-center">
                        <img 
                          src={imagePreview} 
                          alt="Rice Preview" 
                          className="max-h-64 object-contain rounded-lg shadow-sm border border-slate-200 dark:border-slate-700" 
                        />
                        <p className="mt-3 text-xs font-medium text-emerald-600 dark:text-emerald-400">
                          {selectedFile ? selectedFile.name : "Image Ready"}
                        </p>
                      </div>
                    ) : (
                      <>
                        <Icons.Upload />
                        <p className="text-sm font-semibold text-slate-700 dark:text-slate-300">
                          Drag & drop your rice grain image here
                        </p>
                        <p className="text-xs text-slate-400 mt-1">
                          Supports PNG, JPG, WEBP (Resized to 224x224 automatically)
                        </p>
                      </>
                    )}
                  </div>

                  {error && (
                    <div className="mt-4 p-3 bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 rounded-lg text-xs text-rose-600 dark:text-rose-300">
                      {error}
                    </div>
                  )}
                </div>

                {/* Actions */}
                <div className="mt-6 flex items-center space-x-3">
                  <button
                    onClick={handleClassify}
                    disabled={!selectedFile || loading}
                    className={`flex-1 py-3 px-4 rounded-xl font-bold text-sm text-white shadow-md transition-all flex items-center justify-center ${
                      !selectedFile || loading
                        ? 'bg-slate-300 dark:bg-slate-700 cursor-not-allowed opacity-70'
                        : 'bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98]'
                    }`}
                  >
                    {loading ? (
                      <>
                        <Icons.Refresh /> Processing CNN Inference...
                      </>
                    ) : (
                      "Classify Rice Grain"
                    )}
                  </button>

                  {imagePreview && (
                    <button
                      onClick={resetSelection}
                      className="py-3 px-4 rounded-xl font-semibold text-xs text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600"
                    >
                      Reset
                    </button>
                  )}
                </div>
              </div>

              {/* Right Column: Prediction Result */}
              <div className="lg:col-span-6 bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-700/80 flex flex-col justify-between">
                <div>
                  <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100 mb-1">Classification Output</h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mb-5">
                    Real-time predicted grain class & confidence score.
                  </p>

                  {prediction ? (
                    <div className="space-y-6">
                      {/* Top Highlight Badge */}
                      <div className="p-5 bg-gradient-to-r from-emerald-500/10 to-teal-500/10 border border-emerald-500/20 rounded-xl flex items-center justify-between">
                        <div>
                          <span className="text-xs font-semibold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">
                            Predicted Rice Type
                          </span>
                          <h3 className="text-3xl font-extrabold text-slate-900 dark:text-white mt-0.5">
                            {prediction.predicted_class}
                          </h3>
                        </div>
                        <div className="text-right">
                          <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">Confidence</span>
                          <div className="text-2xl font-black text-emerald-600 dark:text-emerald-400">
                            {prediction.confidence.toFixed(1)}%
                          </div>
                        </div>
                      </div>

                      {/* Progress Bar */}
                      <div>
                        <div className="flex justify-between text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">
                          <span>Certainty Level</span>
                          <span>{prediction.confidence.toFixed(1)}%</span>
                        </div>
                        <div className="w-full bg-slate-100 dark:bg-slate-700 h-3 rounded-full overflow-hidden">
                          <div 
                            className="bg-emerald-500 h-full rounded-full transition-all duration-500 ease-out" 
                            style={{ width: `${prediction.confidence}%` }}
                          />
                        </div>
                      </div>

                      {/* Probability Breakdown */}
                      <div>
                        <h4 className="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-3">
                          Class Probabilities Breakdown
                        </h4>
                        <div className="space-y-2.5">
                          {Object.entries(prediction.probabilities || {}).map(([cls, prob]) => (
                            <div key={cls} className="flex items-center text-xs">
                              <span className="w-24 font-semibold text-slate-700 dark:text-slate-300">{cls}</span>
                              <div className="flex-1 bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden mx-3">
                                <div 
                                  className={`h-full rounded-full transition-all duration-500 ${
                                    cls === prediction.predicted_class ? 'bg-emerald-500' : 'bg-slate-300 dark:bg-slate-600'
                                  }`} 
                                  style={{ width: `${prob}%` }}
                                />
                              </div>
                              <span className="w-12 text-right font-mono font-medium text-slate-600 dark:text-slate-400">
                                {prob.toFixed(1)}%
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="h-64 border border-dashed border-slate-200 dark:border-slate-700 rounded-xl flex flex-col items-center justify-center text-center p-6 text-slate-400">
                      <Icons.Leaf />
                      <p className="mt-2 text-sm font-semibold text-slate-500 dark:text-slate-400">No Prediction Yet</p>
                      <p className="text-xs text-slate-400 mt-1 max-w-xs">
                        Select an image on the left and click "Classify Rice Grain" to view classification results.
                      </p>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Bottom Section: SQLite History Dashboard */}
            <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-700/80">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-700/80 mb-4 gap-4">
                <div>
                  <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100">Prediction History Dashboard</h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    All predictions automatically persisted in SQLite database (`backend/history.db`).
                  </p>
                </div>

                <div className="flex items-center space-x-3">
                  <span className="text-xs font-semibold px-3 py-1.5 bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 rounded-lg border border-emerald-200 dark:border-emerald-800">
                    Total Predictions: {history.length}
                  </span>

                  {history.length > 0 && (
                    <button
                      onClick={handleClearHistory}
                      className="px-3 py-1.5 text-xs font-semibold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/50 rounded-lg border border-rose-200 dark:border-rose-800 flex items-center transition-colors"
                    >
                      <Icons.Trash /> Clear History
                    </button>
                  )}
                </div>
              </div>

              {historyLoading ? (
                <div className="py-8 text-center text-xs text-slate-400">Loading prediction history...</div>
              ) : history.length === 0 ? (
                <div className="py-12 text-center text-xs text-slate-400">
                  No prediction records stored yet.
                </div>
              ) : (
                <div className="overflow-x-auto custom-scrollbar">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="border-b border-slate-200 dark:border-slate-700 text-[11px] uppercase tracking-wider text-slate-400 font-semibold">
                        <th className="py-3 px-4"># ID</th>
                        <th className="py-3 px-4">Thumbnail</th>
                        <th className="py-3 px-4">Filename</th>
                        <th className="py-3 px-4">Predicted Rice Class</th>
                        <th className="py-3 px-4">Confidence</th>
                        <th className="py-3 px-4">Timestamp</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-700/50 text-xs text-slate-700 dark:text-slate-300">
                      {history.map((row) => (
                        <tr key={row.id} className="hover:bg-slate-50/60 dark:hover:bg-slate-750 transition-colors">
                          <td className="py-3 px-4 font-mono font-semibold text-slate-400">#{row.id}</td>
                          <td className="py-3 px-4">
                            {row.image_data ? (
                              <img src={row.image_data} alt="Thumbnail" className="w-10 h-10 object-cover rounded-md border border-slate-200 dark:border-slate-700" />
                            ) : (
                              <div className="w-10 h-10 bg-slate-100 dark:bg-slate-700 rounded-md flex items-center justify-center text-slate-400">N/A</div>
                            )}
                          </td>
                          <td className="py-3 px-4 font-medium max-w-[180px] truncate" title={row.filename}>
                            {row.filename}
                          </td>
                          <td className="py-3 px-4 font-bold text-emerald-600 dark:text-emerald-400">
                            {row.predicted_class}
                          </td>
                          <td className="py-3 px-4 font-semibold">
                            <span className="px-2.5 py-1 rounded-full text-[11px] bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
                              {row.confidence.toFixed(1)}%
                            </span>
                          </td>
                          <td className="py-3 px-4 text-slate-400 font-mono text-[11px]">{row.timestamp}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </main>

          {/* Model Metrics Modal */}
          {showMetrics && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
                <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-700 mb-6">
                  <div>
                    <h3 className="text-lg font-bold text-slate-800 dark:text-slate-100">Model Evaluation & Training Metrics</h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400">MobileNetV2 Transfer Learning Performance</p>
                  </div>
                  <button 
                    onClick={() => setShowMetrics(false)}
                    className="p-2 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 bg-slate-100 dark:bg-slate-700"
                  >
                    <Icons.X />
                  </button>
                </div>

                <div className="space-y-6">
                  {/* Evaluation Plots */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                      <h4 className="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-3">Training Accuracy & Loss Plot</h4>
                      {metricsData?.has_accuracy_loss_plot ? (
                        <img src="/model-files/accuracy_loss_plot.png" alt="Accuracy Loss Plot" className="w-full rounded-lg shadow-sm" />
                      ) : (
                        <p className="text-xs text-slate-400 py-8 text-center">Plot not generated yet. Run train.py to generate.</p>
                      )}
                    </div>

                    <div className="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                      <h4 className="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-3">Confusion Matrix Heatmap</h4>
                      {metricsData?.has_confusion_matrix ? (
                        <img src="/model-files/confusion_matrix.png" alt="Confusion Matrix" className="w-full rounded-lg shadow-sm" />
                      ) : (
                        <p className="text-xs text-slate-400 py-8 text-center">Matrix plot not generated yet. Run train.py to generate.</p>
                      )}
                    </div>
                  </div>

                  {/* Classification Report Text */}
                  <div className="bg-slate-900 text-slate-200 p-4 rounded-xl font-mono text-xs overflow-x-auto">
                    <h4 className="text-[11px] uppercase tracking-wider text-emerald-400 font-bold mb-2">Classification Report</h4>
                    <pre className="whitespace-pre-wrap">{metricsData?.classification_report || "No classification report available."}</pre>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-200 dark:border-slate-800 py-4 px-6 text-center text-xs text-slate-400">
            Rice Type Classifier ML Project &bull; TensorFlow / Keras &bull; MobileNetV2 &bull; Flask &bull; SQLite &bull; React
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
